name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Build Data
        uses: actions/cache@v4
        with:
          path: |
            api/
            data_version.json
          key: build-cache-${{ github.sha }}
          restore-keys: |
            build-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pillow rjsmin rcssmin pymupdf

      - name: Test deployment and shared configuration
        run: python -m unittest discover -s tools/tests -v

      - name: Generate API and Data
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: python -u generate_projects.py

      - name: Prepare public site and inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u -m tools.deployment.prepare_public_site --compare-previous

      - name: Upload public site inventory
        uses: actions/upload-artifact@v4
        with:
          name: public-site-inventory
          path: tools/public-site-inventory/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .gh-pages-temp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
