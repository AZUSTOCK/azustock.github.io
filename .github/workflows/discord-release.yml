name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send rich Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_TIME: ${{ github.event.release.published_at || github.event.release.created_at }}
          AUTHOR_NAME: ${{ github.event.release.author.login }}
          AUTHOR_AVATAR: ${{ github.event.release.author.avatar_url }}
          REPO_NAME: ${{ github.repository }}
          SITE_URL: "https://azustock.github.io"
          # 👇 請填入圖片直連網址（支援 PNG / JPG / WebP）；若要顯示大圖請取消下方 embed["image"] 的註解
          BANNER_URL: "https://azustock.github.io/assets/og.png"
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from urllib.parse import quote
          from datetime import datetime, timezone

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook_url:
              raise SystemExit("錯誤：未設定 DISCORD_WEBHOOK Secret。")

          repo = os.environ.get("REPO_NAME", "").strip()
          site_url = os.environ.get("SITE_URL", "").strip()
          tag = os.environ.get("RELEASE_TAG", "").strip()
          title = os.environ.get("RELEASE_TITLE", "").strip()
          body = os.environ.get("RELEASE_BODY", "").strip()
          release_url = os.environ.get("RELEASE_URL", "").strip()
          release_time = os.environ.get("RELEASE_TIME", "").strip()
          author_name = os.environ.get("AUTHOR_NAME", "").strip()
          author_avatar = os.environ.get("AUTHOR_AVATAR", "").strip()

          # 手動觸發 (workflow_dispatch) 時，自動抓最新一筆 Release 來測試輸出樣式
          if os.environ.get("EVENT_NAME") == "workflow_dispatch" and not tag:
              api_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/latest",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ.get('GITHUB_TOKEN', '')}",
                      "User-Agent": "GitHub-Actions-Discord-Notify",
                  },
              )
              try:
                  with urllib.request.urlopen(api_req, timeout=15) as resp:
                      latest = json.loads(resp.read().decode("utf-8"))
                  tag = (latest.get("tag_name") or "").strip()
                  title = (latest.get("name") or tag).strip()
                  body = (latest.get("body") or "").strip()
                  release_url = (latest.get("html_url") or "").strip()
                  release_time = (latest.get("published_at") or latest.get("created_at") or "").strip()
                  author = latest.get("author") or {}
                  author_name = (author.get("login") or "").strip()
                  author_avatar = (author.get("avatar_url") or "").strip()
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      raise SystemExit("目前儲存庫還沒有已發佈的 Release，請先建立一筆 Release 再手動測試。")
                  raise

          title = title or tag
          release_time = release_time or datetime.now(timezone.utc).isoformat()
          banner_url = os.environ.get("BANNER_URL", "").strip()

          # 根據標題或內文前 200 字關鍵字自動切換顏色
          check_text = (title + " " + body[:200]).upper()
          if "REFACTOR" in check_text:
              embed_color = 0xC77DFF  # 紫色
          elif any(k in check_text for k in ["HOTFIX", "PATCH", "BUG"]):
              embed_color = 0xFF4D79  # 紅色
          elif any(k in check_text for k in ["FEATURE", "MAJOR", "NEW"]):
              embed_color = 0xF5D547  # 黃色
          else:
              embed_color = 0x44D4BE  # 預設藍綠色

          # 標題放進 description 頂端，才能把超連結精準掛在「版本號」上，並消除與內文之間的空行
          header_line = f"### [{tag}]({release_url}) RELEASE" if release_url else f"### {tag} RELEASE"
          lines = [header_line]
          if repo:
              lines.append(f"-# {repo}")
          if title and title != tag:
              lines.append(f"**{title}**")
          if body:
              lines.append(body)

          site_link_url = f"{site_url.rstrip('/')}/?v={quote(tag, safe='')}" if (site_url and tag) else site_url
          footer_link = f"\n[Visit Website ↗]({site_link_url})" if site_link_url else ""
          max_body_len = 4000 - len(footer_link)
          description = "\n".join(lines)
          if len(description) > max_body_len:
              description = description[: max_body_len - 3] + "..."
          description += footer_link

          embed = {
              "author": {
                  "name": author_name,
                  "icon_url": author_avatar
              },
              "description": description,
              "color": embed_color,
              "footer": {
                  "text": f"Version {tag}"
              },
              "timestamp": release_time
          }

          # 若有設定 Banner 網址，取消下方兩行註解即可加入大圖預覽
          if banner_url:
              embed["image"] = {"url": banner_url}

          payload = {
              "embeds": [embed]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print(f"Discord notification sent (HTTP {resp.status}).")
          PY
