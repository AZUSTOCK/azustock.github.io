name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留白使用最新正式 Release）'
        type: string
        required: false
      send:
        description: '發送到 Discord（未勾選只預覽）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 使用預設分支的通知工具；舊 Release 也能套用最新版格式。
      - name: Checkout notification tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send rich Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SEND: ${{ inputs.send }}
          SITE_URL: "https://azustock.com"
          BANNER_URL: "https://azustock.com/assets/og.png"
        run: python3 tools/discord_release.py
